[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ls4t"
version = "0.1.0"
description = "Product-oriented land-surface and component-temperature processing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]
slstr = ["netCDF4>=1.6"]
aatsr = ["pyepr>=1.1"]
msg = ["satpy>=0.49"]
projection = ["GDAL>=3.6"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["composite", "applications"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
