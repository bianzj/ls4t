[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ls4t"
version = "0.1.0"
description = "Product-oriented land-surface and component-temperature processing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "h5py>=3", "scipy>=1.10", "scikit-learn>=1.2"]

[project.optional-dependencies]
test = ["pytest>=7"]
slstr = ["netCDF4>=1.6", "GDAL>=3.6"]
aatsr = ["pyepr>=1.1"]
msg = ["satpy>=0.49", "GDAL>=3.6"]
raster = ["GDAL>=3.6"]
projection = ["GDAL>=3.6"]
msg-sample = ["pytest>=7", "GDAL>=3.6", "h5py>=3", "scipy>=1.10", "scikit-learn>=1.2", "pvlib>=0.10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["base*"]
exclude = ["base.templates*", "cases*", "old*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
