schema_version = 1

[case]
id = "stream-global-era5-forcing"
sensor = "stream"
region = "global"
status = "draft"
spatial_mode = "fixed-grid"
description = "Convert monthly global ERA5 to daily STREAM forcing HDF5 and time files."

[stages]
download = "run.py download"
extract = "run.py extract"
check = "run.py check"

[provenance]
source_project = "ship_stream"
source_path = "/home/hero/code/ship_stream/era5"
source_scripts = [
  "era5_download.py",
  "era5_download_1.py",
  "era5_download_2.py",
  "era5_download_3.py",
  "extract_era5_data.py",
  "extract_era5_data_v2.py",
  "era5_extract_check.py",
]
