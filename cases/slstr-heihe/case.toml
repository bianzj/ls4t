schema_version = 1

[case]
id = "slstr-heihe-daily-mosaic"
sensor = "slstr"
region = "heihe"
status = "draft"
spatial_mode = "scene-first"
description = "Heihe river basin scene-first LST/LSCT2 daily mosaics. LST keeps cloudy pixels; LSCT2 keeps its own cloud screening."

[period]
years = [2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]

[grid]
id = "heihe_0p01"
crs = "EPSG:4326"
resolution_degree = 0.01
# west, south, east, north - inner rectangle of the region-first study area
bounds = [96.60, 37.34, 102.85, 43.09]
width_px = 625
height_px = 575

[processing]
views = ["nadir", "obliq"]
products = ["lst_nadir", "lsct2", "time"]
day_solar_zenith_threshold = 90.0
overlap_rule = "later acquisition overwrites earlier"
# 温度反演保留云；拼接阶段按景云标记剔云（--no-cloud-mask 可关）
lst_cloud_mask_in_retrieval = false
mosaic_cloud_mask = true
lsct2_lai_min = 0.05
overwrite = false

[stages]
window = "stages/window_coverage.py"
mosaic = "stages/run_daily_mosaic.sh"

[provenance]
ls4t_revision = "3278a21"
source_project = "ls4t-slstr-lsct"
source_scripts = [
  "cases/regions/heihe_lst_parallel.py",
  "cases/implementation/one_by_one/slstr_lsct2_parallel.py",
  "cases/regions/heihe_daily_mosaic.py",
  "cases/regions/heihe_lst_coverage.py",
]
