schema_version = 1

[case]
id = "msg-europe-africa-dual-disk"
sensor = "msg"
region = "europe-africa"
status = "migrated"
spatial_mode = "fixed-grid"
description = "MSG/SEVIRI LST fitting and LSCT inversion, flat production tree."

[processing]
order = ["official-mlst-mdlai", "project", "lsct-inversion"]
optional = ["extract-native", "lst-fit-fallback"]
primary_lst_source = "downloaded LSASAF MLST"
fallback_lst = "msg_lst_fit.py"
download_lai = "msg_download.py"
extract_euro = "msg_extract_euro.py"
extract_iodc = "msg_extract_iodc.py"
project_euro = "msg_project_euro.py"
project_euro_lai = "msg_project_euro_lai.py"
project_iodc = "msg_project_iodc.py"
lst_fit = "msg_lst_fit.py"
lsct_inversion = "msg_lsct_iter.py"
site_extract_lst = "msg_site_extract_lst.py"
site_extract_lai = "msg_site_extract_lai.py"
site_extract_static = "msg_site_extract_static.py"
site_extract_csv = "msg_site_extract_csv.py"
site_angle_fit = "msg_site_fit.py"
site_validate = "msg_site_validate.py"
site_stats = "msg_site_stats.py"
site_extract_series = "msg_site_extract_series.py"
site_repro_lst = "msg_site_repro_lst.py"
site_repro_lsct = "msg_site_repro_lsct.py"
site_validate_multisite = "msg_site_validate_multisite.py"
lsct_2c_full = "experiments/msg_lsct_2c_window.py"
lsct_3c_full = "experiments/msg_lsct_3c_window.py"
lsct_3c_2stage_full = "experiments/msg_lsct_3c_two_stage.py"
lsct_3c_constrained_full = "experiments/msg_lsct_3c_constrained.py"
lsct_3c_show_full = "experiments/msg_lsct_3c_diagnostics.py"
current_entrypoint = "msg_lsct_iter.py"
smoke_test = "msg_smoke_test.py"
standard_core = false

[scope]
processes = ["official-product", "project", "lsct-inversion", "optional-native-lst", "site-test"]
site_tests = ["component temperature validation", "angle fitting (DTC/DTCRL/DTCLSFRL)"]
note = "正常生产使用下载的 LSASAF MLST/MDLAI；native 提取和自研 LST 仅作备用或算法对照。"

[methods]
lst_script = "msg_lst_fit.py"
lst_role = "fallback only; normal production uses downloaded LSASAF MLST"
lst_algorithm = "MSG/SEVIRI IR_108+IR_120 generalized split-window with MSG-specific day/night coefficients"
lst_tcwv = "/home/hero/data/rs/tcwv/<year>/tcwv_YYYYMMDD.h5 (rs-h5 v1, converted from kg m-2 to cm)"
lst_output = "PRODUCTS/LS4T/MSG{,-IODC}/MLST/HDF5"
lsct_script = "msg_lsct_iter.py"
lsct_formal = "lambda=100 constraints=True dif=3 outdir=PRODUCTS/LSCT/MLST_COMPONENT"
lsct_test = "historical separate implementation; archived products remain in PRODUCTS/LSCT/MLST_COMPONENT2"
alternatives_archived = [
  "util_lsct winconst/winquad/winquad_constraint (SLSQP / Bayesian ridge)",
  "reference: base/msg/msg_lsct.py + base.lsct.retrieve_components(_window)",
  "lsct3.1 non-iter (historical weak-prior test implementation)",
  "lsct3.2 non-iter (superseded by the formal msg_lsct_iter.py)",
  "lsct3.2-iter-site* point solutions",
]

# 正式入口在 cases/msg；其余对照方法在 experiments/：
[methods.full_disk]
two_component = "experiments/msg_lsct_2c_window.py"                 # 2 组分（土壤 + 植被），5x5 窗口最小二乘，逐分量 tif
three_component = "experiments/msg_lsct_3c_window.py"               # 3 组分（光照土壤 + 阴影土壤 + 植被），3x3 窗口最小二乘
three_component_2stage = "experiments/msg_lsct_3c_two_stage.py" # 3 组分两阶段：先[光照土壤]vs[阴影土壤+植被]，再分[阴影土壤]vs[植被]（无约束）
three_component_production = "msg_lsct_iter.py"       # 正式版（硬约束 + lambda=100 先验平差）
three_component_constrained = "experiments/msg_lsct_3c_constrained.py"  # 同一硬约束的全向量化实现（对照）
three_component_show = "experiments/msg_lsct_3c_diagnostics.py"     # 正式算法 + 逐景 4 分量对比出图（对照）

[dependencies]
policy = "case 脚本只从 base/ 导入项目代码，不再有 support 夹层和星号导入。"
base = [
  "base/files.py",
  "base/spatial.py",
  "base/dates.py",
  "base/lsct.py",
  "base/radiometry.py",
  "base/rt/gap.py",
  "base/kernel.py",
]
tests = "tests/test_msg_case_dependencies.py"

[provenance]
source_repository = "git@github.com:bianzj/ls4t-msg.git"
source_revision = "0070934"
flattened = "2026-09-16"
archived = "cases/_archive/msg/transferred_20260916"
note = "LST 拟合取自 cases/ingest/msg_data_lst_euro.py，LSCT 反演取自 cases/implementation/msg_lsct3.2-iter.py。"
