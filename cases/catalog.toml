version = 2

[policy]
case_layout = "cases/<sensor>/<region>/<case-id>"
machine_layout = "<case>/machines/<machine-id>.toml"
active_requires = ["case.toml", "documented entrypoint", "tested LS4T revision"]
archive_root = "_archive"

[[case]]
id = "aatsr-global-001deg-2003-2012"
sensor = "aatsr"
region = "global"
status = "active"
spatial_mode = "temporal-composite"
path = "aatsr/global/001deg_2003_2012"
entrypoints = ["aatsr_001deg_stats.py", "aatsr_monthly_3files.py"]

[[case]]
id = "msg-europe-africa-dual-disk"
sensor = "msg"
region = "europe-africa"
status = "migrated"
spatial_mode = "fixed-grid"
path = "msg/europe_africa/dual_disk"
entrypoints = ["lsct/msg_lsct3.2-iter.py", "lsct/msg_monthly_averaging.py"]

[[case]]
id = "slstr-heihe-2022-study-area"
sensor = "slstr"
region = "heihe"
status = "migrated"
spatial_mode = "study-area-first"
path = "slstr/heihe/study_area_2022"
entrypoints = ["study_area/slstr_lst.py"]

[[case]]
id = "slstr-europe-south-africa-scene-first"
sensor = "slstr"
region = "europe-south-africa"
status = "migrated"
spatial_mode = "scene-first"
path = "slstr/europe_south_africa/scene_first_migrated"
entrypoints = ["scene_first/slstr_lst.py"]

[[case]]
id = "modis-unclassified-legacy"
sensor = "modis"
region = "unclassified"
status = "draft"
spatial_mode = "study-area-first"
path = "modis/unclassified/legacy_draft"
entrypoints = ["data/MODIS_data.py", "lst/MODIS_lst.py"]

[[case]]
id = "viirs-unclassified-legacy"
sensor = "viirs"
region = "unclassified"
status = "draft"
spatial_mode = "study-area-first"
path = "viirs/unclassified/legacy_draft"
entrypoints = ["data/VIIRS_data.py", "lst/VIIRS_lst.py"]

[[case]]
id = "ahi-unclassified-legacy"
sensor = "ahi"
region = "unclassified"
status = "draft"
spatial_mode = "fixed-grid"
path = "ahi/unclassified/legacy_draft"
entrypoints = ["data/AHI_data.py", "lst/AHI_lst.py"]

[[archive]]
path = "_archive/aatsr/product_history"
reason = "duplicate historical product implementations and backups"

[[archive]]
path = "_archive/msg"
reason = "pre-reorganization snapshots, experiments and old validation"

[[archive]]
path = "_archive/slstr/mixed_batch"
reason = "mixed Europe, South Africa and machine-specific paths"

[[archive]]
path = "_archive/shared"
reason = "unverified cross-sensor and download scripts"
