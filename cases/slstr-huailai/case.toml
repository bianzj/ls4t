schema_version = 1

[case]
id = "slstr-huailai-scene-first"
sensor = "slstr"
region = "huailai"
status = "active"
spatial_mode = "scene-first"
description = "Huailai County 2024 SLSTR scene products with exact Heihe products reused."

[period]
years = [2024]

[grid]
id = "huailai_0p01"
crs = "EPSG:4326"
resolution_degree = 0.01
# Huailai County: about 115°16'–115°58'E, 40°04'–40°35'N.
bounds = [115.26, 40.06, 115.98, 40.60]
width_px = 72
height_px = 54

[processing]
views = ["nadir", "obliq"]
products = ["lst_nadir", "lst_obliq", "lsct", "time"]
day_solar_zenith_threshold = 90.0
overlap_rule = "later acquisition overwrites earlier"
lst_cloud_mask_in_retrieval = false
mosaic_cloud_mask = true
lsct2_lai_min = 0.05
overwrite = false

[stages]
reuse = "stages/prepare_reuse.py"
audit = "stages/audit_outputs.py"

[provenance]
source_case = "cases/slstr-heihe"
source_scripts = [
  "cases/slstr/slstr_data_scene_origin.py",
  "cases/slstr/slstr_scene_coverage.py",
  "cases/slstr/slstr_lst_scene_parallel.py",
  "cases/slstr/slstr_lsct2_scene_parallel.py",
]
