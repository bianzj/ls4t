schema_version = 1

[case]
id = "slstr-europe-daily-mosaic"
sensor = "slstr"
region = "europe"
status = "draft"
spatial_mode = "scene-first"
description = "Europe + North Africa scene-first LST/LSCT2 daily mosaics. LST keeps cloudy pixels; LSCT2 keeps its own cloud screening."

[period]
years = [2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]

[grid]
id = "europe_0p01"
crs = "EPSG:4326"
resolution_degree = 0.01
# west, south, east, north - mosaic window of euro_lst_window.json
bounds = [-12.0, 30.0, 42.0, 71.5]
width_px = 5400
height_px = 4150

[processing]
views = ["nadir", "obliq"]
products = ["lst_nadir", "lsct", "time"]
day_solar_zenith_threshold = 90.0
overlap_rule = "later acquisition overwrites earlier"
lst_cloud_mask_in_retrieval = false
mosaic_cloud_mask = true
lsct2_lai_min = 0.05
overwrite = false

[stages]
window = "stages/window_coverage.py"
mosaic = "stages/run_daily_mosaic.sh"

[provenance]
ls4t_revision = "3278a21"
source_project = "ls4t-slstr-lsct"
source_scripts = [
  "cases/implementation/one_by_one/slstr_lst_parallel.py",
  "cases/implementation/one_by_one/slstr_lsct2_parallel.py",
  "cases/regions/euro_daily_mosaic.py",
  "cases/regions/euro_lst_coverage.py",
]
