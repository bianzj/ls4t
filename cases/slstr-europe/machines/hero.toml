[machine]
id = "hero"

[paths]
scene_root = "/media/hero/slstr-euro-lst"
# 旧口径产物在 euro_daily_0p01（未剔云、_done 标记会跳过重跑）；统一口径写新目录
output_root = "/media/hero/slstr-euro-lst/europe_daily_0p01"
auxiliary_root = "/home/hero/data/rs"
auxiliary_fallback = "/media/hero/rs"
emissivity_root = "/home/hero/data/rs/emissivity"
type_reference = "/home/hero/data/rs/land-cover/type/type_world_1000.tif"
tcwv_root = "/home/hero/data/rs/tcwv"
# 欧洲盘自带的 base/emis、base/type 是同一份全局栅格的副本，可作第二回退
disk_base_fallback = "/media/hero/slstr-euro-lst/base"

[runtime]
python = "/home/hero/anaconda3/envs/env_311/bin/python3.11"
workers = 16

[notes]
paths = "2016 年为空盘；输出沿用既有 euro_daily_0p01 目录，重跑前先确认是否要保留旧口径结果。"
