<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>LS4T</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f5f6f8; --panel: #fff; --line: #e3e6eb; --text: #1f2933; --muted: #6b7785;
    --accent: #1f6feb; --accent-soft: #e8f0fe; --ok: #1a7f37; --bad: #cf222e; --warn: #9a6700;
    --mono: ui-monospace, "Cascadia Code", Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 14px/1.5 system-ui, "Microsoft YaHei", "PingFang SC", sans-serif; color: var(--text); background: var(--bg);
         display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 24px; padding: 0 20px; height: 52px; background: #14213d; color: #fff; flex: none; }
  header .logo { font-weight: 700; font-size: 18px; letter-spacing: .5px; }
  header nav { display: flex; gap: 4px; }
  header nav button { background: none; border: 0; color: #c9d3e6; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  header nav button.active { background: rgba(255,255,255,.14); color: #fff; }
  header .repo { margin-left: auto; font-family: var(--mono); font-size: 12px; color: #9fb0cc; }
  .view { flex: 1; display: none; min-height: 0; }
  .view.active { display: flex; }
  aside { width: 300px; flex: none; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  aside .search { padding: 12px; border-bottom: 1px solid var(--line); }
  aside .tree { overflow: auto; flex: 1; padding: 6px 0 16px; }
  .section { padding: 14px 14px 4px; font-size: 12px; font-weight: 600; color: var(--muted); display: flex; align-items: center; }
  .section button { margin-left: auto; }
  .group { padding: 6px 14px 2px; font-size: 12px; color: var(--muted); font-family: var(--mono); }
  .item { padding: 4px 14px 4px 26px; cursor: pointer; font-family: var(--mono); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item:hover { background: #f0f3f7; }
  .item.active { background: var(--accent-soft); color: var(--accent); }
  .case-name { padding: 5px 14px; cursor: pointer; font-weight: 600; display: flex; gap: 6px; align-items: center; }
  .case-name:hover { background: #f0f3f7; }
  .case-name .count { margin-left: auto; font-weight: 400; color: var(--muted); font-size: 12px; }
  .empty { padding: 4px 14px 4px 26px; color: var(--muted); font-size: 12px; }
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  .scroll { flex: 1; overflow: auto; padding: 20px 24px; min-height: 0; }
  input[type=text], select { font: inherit; padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: #fff; width: 100%; }
  input.mono { font-family: var(--mono); font-size: 13px; }
  button.btn { font: inherit; border: 1px solid var(--line); background: #fff; padding: 6px 14px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
  button.btn:hover { border-color: #b8c2cf; }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.btn.danger { color: var(--bad); }
  button.btn.small { padding: 2px 8px; font-size: 12px; }
  button.btn:disabled { opacity: .5; cursor: default; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 16px; }
  .card > .head { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .card > .head h3 { margin: 0; font-size: 14px; }
  .card > .body { padding: 12px 16px; }
  h2 { margin: 0 0 4px; font-size: 18px; font-family: var(--mono); word-break: break-all; }
  .sub { color: var(--muted); margin-bottom: 16px; }
  .badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px; background: #eef1f4; color: var(--muted); }
  .badge.lib { background: #fff4d6; color: var(--warn); }
  .badge.case { background: #dcf3e3; color: var(--ok); }
  .fn { border-top: 1px solid var(--line); padding: 10px 16px; }
  .fn:first-child { border-top: 0; }
  .fn .sig { font-family: var(--mono); font-size: 13px; cursor: pointer; word-break: break-all; }
  .fn .sig b { color: var(--accent); }
  .fn .doc { color: var(--muted); font-size: 13px; }
  .fn .where { color: var(--muted); font-size: 12px; font-family: var(--mono); }
  pre.code { margin: 8px 0 0; background: #0f172a; color: #e2e8f0; border-radius: 6px; padding: 10px 0; overflow: auto; font: 12.5px/1.55 var(--mono); max-height: 520px; }
  pre.code .ln { display: inline-block; width: 52px; padding-right: 12px; text-align: right; color: #64748b; user-select: none; }
  pre.code .hl { background: rgba(250, 204, 21, .16); display: block; }
  table.cfg { width: 100%; border-collapse: collapse; }
  table.cfg td { padding: 5px 6px; border-top: 1px solid var(--line); vertical-align: middle; }
  table.cfg tr:first-child td { border-top: 0; }
  table.cfg td.name { font-family: var(--mono); font-size: 13px; width: 26%; word-break: break-all; }
  table.cfg td.line { color: var(--muted); font-size: 12px; width: 60px; text-align: right; }
  table.cfg tr.changed input { border-color: var(--warn); background: #fffbeb; }
  .row { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; }
  .hint { color: var(--muted); font-size: 13px; }
  .placeholder { color: var(--muted); text-align: center; margin-top: 18vh; }
  .placeholder h2 { font-family: inherit; color: var(--text); margin-bottom: 8px; }
  .steps { display: inline-flex; gap: 10px; margin-top: 16px; }
  .steps span { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 8px 14px; }
  #runs { flex: none; height: 260px; border-top: 1px solid var(--line); background: var(--panel); display: flex; min-height: 0; }
  #runs.collapsed { height: 36px; }
  #runList { width: 340px; border-right: 1px solid var(--line); overflow: auto; flex: none; }
  #runs .bar { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-bottom: 1px solid var(--line); font-weight: 600; font-size: 13px; height: 36px; }
  .run { padding: 6px 12px; cursor: pointer; font-size: 12px; border-bottom: 1px solid #f0f2f5; }
  .run:hover { background: #f6f8fa; }
  .run.active { background: var(--accent-soft); }
  .run .p { font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st { font-weight: 600; }
  .st.running, .st.stopping { color: var(--accent); } .st.done { color: var(--ok); } .st.failed, .st.stopped { color: var(--bad); }
  #logBox { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #log { flex: 1; margin: 0; padding: 8px 12px; overflow: auto; background: #0f172a; color: #d1d9e6; font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-all; }
  #toast { position: fixed; right: 20px; top: 64px; padding: 10px 16px; border-radius: 6px; color: #fff; background: #334155; display: none; max-width: 460px; z-index: 10; box-shadow: 0 4px 16px rgba(0,0,0,.18); }
  #toast.err { background: var(--bad); } #toast.ok { background: var(--ok); }
  dialog { border: 1px solid var(--line); border-radius: 10px; padding: 0; width: 440px; }
  dialog::backdrop { background: rgba(15, 23, 42, .35); }
  dialog .head { padding: 14px 18px; border-bottom: 1px solid var(--line); font-weight: 600; }
  dialog .body { padding: 16px 18px; display: grid; gap: 10px; }
  dialog .foot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }
  label.f { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  .readme { white-space: pre-wrap; font-size: 13px; background: #fafbfc; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin: 0; }
</style>
</head>
<body>
<header>
  <div class="logo">LS4T</div>
  <nav>
    <button data-view="base" class="active">Base 函数库</button>
    <button data-view="case">Case 案例</button>
  </nav>
  <div class="repo" id="repo"></div>
</header>

<!-- ============================== Base ============================== -->
<section class="view active" id="view-base">
  <aside>
    <div class="search"><input type="text" id="baseSearch" placeholder="搜索函数 / 模块，例如 planck"></div>
    <div class="tree" id="baseTree"></div>
  </aside>
  <main><div class="scroll" id="baseMain"></div></main>
</section>

<!-- ============================== Case ============================== -->
<section class="view" id="view-case">
  <aside>
    <div class="search"><input type="text" id="caseSearch" placeholder="筛选脚本"></div>
    <div class="tree" id="caseTree"></div>
  </aside>
  <main>
    <div class="scroll" id="caseMain"></div>
    <div id="runs">
      <div id="runList"><div class="bar">运行记录 <button class="btn small" id="toggleRuns" style="margin-left:auto">收起</button></div><div id="runItems"></div></div>
      <div id="logBox"><div class="bar"><span id="logTitle" class="grow">日志</span><button class="btn small danger" id="stopBtn" disabled>停止</button></div><pre id="log"></pre></div>
    </div>
  </main>
</section>

<dialog id="copyDialog">
  <form method="dialog">
    <div class="head">复制到案例</div>
    <div class="body">
      <div class="hint" id="copySource"></div>
      <label class="f">选择已有案例
        <select id="copyCase"></select>
      </label>
      <label class="f">或新建案例（区域_时间_传感器）
        <input type="text" id="copyNew" class="mono" placeholder="heihe_2023_slstr">
      </label>
      <label class="row hint"><input type="checkbox" id="copyOverwrite"> 已存在时覆盖</label>
    </div>
    <div class="foot"><button class="btn" value="cancel">取消</button><button class="btn primary" id="copyOk" value="ok">复制</button></div>
  </form>
</dialog>

<dialog id="newDialog">
  <form method="dialog">
    <div class="head">新建案例</div>
    <div class="body">
      <label class="f">案例名（区域_时间_传感器）<input type="text" id="newName" class="mono" placeholder="heihe_2023_slstr"></label>
    </div>
    <div class="foot"><button class="btn" value="cancel">取消</button><button class="btn primary" value="ok">新建</button></div>
  </form>
</dialog>

<div id="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const state = { base: [], baseModule: null, lib: [], cases: [], script: null, python: "", runs: [], runId: null, logOffset: 0, openCases: new Set() };

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
let toastTimer;
function toast(msg, kind = "") {
  const t = $("#toast"); t.textContent = msg; t.className = kind; t.style.display = "block";
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = "none", kind === "err" ? 6000 : 2500);
}
function codeBlock(source, first = 1, highlight = new Set()) {
  return `<pre class="code">${source.split("\n").map((l, i) => {
    const n = first + i; const line = `<span class="ln">${n}</span>${esc(l)}`;
    return highlight.has(n) ? `<span class="hl">${line}</span>` : line + "\n";
  }).join("")}</pre>`;
}

/* ------------------------------ tabs ------------------------------ */
document.querySelectorAll("header nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("header nav button").forEach(x => x.classList.toggle("active", x === b));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === "view-" + b.dataset.view));
  if (b.dataset.view === "case") loadCases();
});

/* ------------------------------ base ------------------------------ */
async function loadBase() {
  state.base = await api("/api/base/modules");
  renderBaseTree(); renderBaseMain();
}
function renderBaseTree() {
  const q = $("#baseSearch").value.trim().toLowerCase();
  const groups = {};
  for (const m of state.base) {
    const dir = m.path.split("/").slice(0, -1).join("/");
    const hit = !q || m.module.toLowerCase().includes(q) || m.items.some(i => i.name.toLowerCase().includes(q));
    if (hit) (groups[dir] ||= []).push(m);
  }
  $("#baseTree").innerHTML = Object.entries(groups).map(([dir, ms]) =>
    `<div class="group">${esc(dir)}/</div>` + ms.map(m =>
      `<div class="item ${state.baseModule === m.path ? "active" : ""}" data-path="${esc(m.path)}" title="${esc(m.doc)}">${esc(m.path.split("/").pop())} <span class="hint">${m.items.length}</span></div>`).join("")
  ).join("") || `<div class="empty">没有匹配</div>`;
  $("#baseTree").querySelectorAll(".item").forEach(el => el.onclick = () => { state.baseModule = el.dataset.path; renderBaseTree(); renderBaseMain(); });
}
function fnHtml(m, i) {
  return `<div class="fn" data-path="${esc(m.path)}" data-line="${i.line}" data-end="${i.end}">
    <div class="sig">${i.kind === "class" ? "class " : ""}<b>${esc(i.name)}</b>${esc(i.signature.slice(i.name.length))}</div>
    ${i.doc ? `<div class="doc">${esc(i.doc)}</div>` : ""}
    <div class="where">from ${esc(m.module)} import ${esc(i.name)} · 第 ${i.line} 行</div>
    <div class="src"></div></div>`;
}
function renderBaseMain() {
  const q = $("#baseSearch").value.trim().toLowerCase();
  const main = $("#baseMain");
  if (q && !state.baseModule) {
    const hits = state.base.flatMap(m => m.items.filter(i => i.name.toLowerCase().includes(q)).map(i => [m, i]));
    main.innerHTML = `<h2>搜索：${esc(q)}</h2><div class="sub">${hits.length} 个函数</div>
      <div class="card">${hits.map(([m, i]) => fnHtml(m, i)).join("") || `<div class="body hint">没有匹配的函数</div>`}</div>`;
  } else if (state.baseModule) {
    const m = state.base.find(x => x.path === state.baseModule);
    const items = m.items.filter(i => !q || i.name.toLowerCase().includes(q) || m.module.toLowerCase().includes(q));
    main.innerHTML = `<h2>${esc(m.module)}</h2><div class="sub">${esc(m.doc || m.path)}${m.error ? " · 解析失败" : ""}</div>
      <div class="card">${items.map(i => fnHtml(m, i)).join("") || `<div class="body hint">没有公开函数</div>`}</div>`;
  } else {
    const total = state.base.reduce((s, m) => s + m.items.length, 0);
    main.innerHTML = `<div class="placeholder"><h2>Base 函数库</h2>
      <div>${state.base.length} 个模块，${total} 个函数/类。左侧选择模块，或在上方搜索函数名；点函数签名查看源码。</div>
      <div class="steps"><span>base/ 只放函数</span><span>案例脚本 from base... import</span></div></div>`;
  }
  main.querySelectorAll(".fn .sig").forEach(sig => sig.onclick = async () => {
    const fn = sig.parentElement, box = fn.querySelector(".src");
    if (box.innerHTML) { box.innerHTML = ""; return; }
    const info = await api("/api/source?path=" + encodeURIComponent(fn.dataset.path));
    const a = +fn.dataset.line, b = +fn.dataset.end;
    box.innerHTML = codeBlock(info.source.split("\n").slice(a - 1, b).join("\n"), a);
  });
}
$("#baseSearch").oninput = () => { if ($("#baseSearch").value.trim()) state.baseModule = null; renderBaseTree(); renderBaseMain(); };

/* ------------------------------ case ------------------------------ */
async function loadCases() {
  const data = await api("/api/case/list");
  state.lib = data.library; state.cases = data.cases;
  renderCaseTree();
  if (!state.script) renderCaseMain();
}
function scriptItem(path, label) {
  const active = state.script && state.script.path === path ? "active" : "";
  return `<div class="item ${active}" data-script="${esc(path)}" title="${esc(path)}">${esc(label)}</div>`;
}
function renderCaseTree() {
  const q = $("#caseSearch").value.trim().toLowerCase();
  const match = p => !q || p.toLowerCase().includes(q);
  let html = `<div class="section">案例库 <span class="hint" style="margin-left:6px;font-weight:400">通用，复制后使用</span></div>`;
  const lib = state.lib.map(g => {
    const s = g.scripts.filter(match);
    return s.length ? `<div class="group">${esc(g.name)}/</div>` + s.map(p => scriptItem(p, p.slice(g.name.length + 1))).join("") : "";
  }).join("");
  html += lib || `<div class="empty">根目录下还没有通用案例脚本</div>`;
  html += `<div class="section">运行案例 cases/ <button class="btn small" id="newCaseBtn">+ 新建</button></div>`;
  html += state.cases.map(c => {
    const s = c.scripts.filter(match);
    if (q && !s.length && !match(c.name)) return "";
    const open = state.openCases.has(c.name) || q;
    return `<div class="case-name" data-case="${esc(c.name)}">${open ? "▾" : "▸"} ${esc(c.name)}<span class="count">${c.scripts.length}</span></div>` +
      (open ? (s.map(p => scriptItem(p, p.slice(`cases/${c.name}/`.length))).join("") || `<div class="empty">空，可从案例库复制脚本</div>`) : "");
  }).join("") || `<div class="empty">还没有案例</div>`;
  $("#caseTree").innerHTML = html;
  $("#caseTree").querySelectorAll("[data-script]").forEach(el => el.onclick = () => openScript(el.dataset.script));
  $("#caseTree").querySelectorAll("[data-case]").forEach(el => el.onclick = () => {
    const n = el.dataset.case; state.openCases.has(n) ? state.openCases.delete(n) : state.openCases.add(n);
    renderCaseTree(); if (!state.script) renderCaseMain(n);
  });
  $("#newCaseBtn").onclick = e => { e.stopPropagation(); $("#newName").value = ""; $("#newDialog").showModal(); };
}
$("#caseSearch").oninput = renderCaseTree;

async function openScript(path) {
  try { state.script = await api("/api/source?path=" + encodeURIComponent(path)); }
  catch (e) { return toast(e.message, "err"); }
  if (state.script.case) state.openCases.add(state.script.case);
  renderCaseTree(); renderCaseMain();
}
function renderCaseMain(caseName) {
  const main = $("#caseMain"), s = state.script;
  if (!s) {
    const c = caseName && state.cases.find(x => x.name === caseName);
    main.innerHTML = c
      ? `<h2>cases/${esc(c.name)}</h2><div class="sub">${c.scripts.length} 个脚本</div>${c.readme ? `<pre class="readme">${esc(c.readme)}</pre>` : ""}`
      : `<div class="placeholder"><h2>Case 案例</h2><div>新任务的做法：从案例库挑脚本复制到 cases/，改开头的配置，然后运行。</div>
         <div class="steps"><span>① 选脚本</span><span>② 复制到案例</span><span>③ 改配置</span><span>④ 运行看日志</span></div></div>`;
    return;
  }
  const editable = s.in_cases;
  const cfgRows = s.config.map((c, k) => `<tr data-k="${k}"><td class="name">${esc(c.name)}</td>
      <td><input type="text" class="mono" value="${esc(c.text)}" ${editable ? "" : "readonly"}></td><td class="line">第 ${c.line} 行</td></tr>`).join("");
  const caseObj = s.case && state.cases.find(c => c.name === s.case);
  main.innerHTML = `
    <div class="row" style="align-items:flex-start">
      <div class="grow"><h2>${esc(s.path)}</h2>
        <div class="sub">${editable ? `<span class="badge case">运行案例 · ${esc(s.case)}</span>` : `<span class="badge lib">案例库 · 只读</span> 复制到 cases/ 后才能修改和运行`}</div></div>
      <div class="row">
        <button class="btn" id="copyBtn">复制到案例…</button>
        ${editable ? `<button class="btn" id="saveBtn">保存配置</button><button class="btn primary" id="runBtn">运行</button>` : ""}
      </div>
    </div>
    ${editable ? `<div class="card"><div class="body row"><span class="hint" style="white-space:nowrap">解释器</span>
       <input type="text" class="mono grow" id="pythonInput" value="${esc(state.python)}"></div></div>` : ""}
    <div class="card"><div class="head"><h3>配置</h3><span class="hint">脚本中值为字面量的赋值（路径、年份、参数等）；值按 Python 写法填写，字符串带引号</span></div>
      ${s.parse_error ? `<div class="body hint">脚本无法解析（可能是 Python 2 语法），请直接编辑源码。</div>`
        : s.config.length ? `<div class="body"><table class="cfg">${cfgRows}</table></div>` : `<div class="body hint">没有识别到配置项</div>`}</div>
    ${caseObj && caseObj.readme ? `<div class="card"><div class="head"><h3>案例说明 README.md</h3></div><div class="body"><pre class="readme">${esc(caseObj.readme)}</pre></div></div>` : ""}
    <div class="card"><div class="head"><h3>源码</h3><span class="hint">高亮行为配置项</span><button class="btn small" id="srcToggle" style="margin-left:auto">展开</button></div>
      <div class="body" id="srcBody" style="display:none"></div></div>`;
  $("#copyBtn").onclick = openCopy;
  if (editable) {
    $("#saveBtn").onclick = saveConfig;
    $("#runBtn").onclick = runScript;
    $("#pythonInput").oninput = e => state.python = e.target.value;
    main.querySelectorAll("table.cfg input").forEach(inp => inp.oninput = () => {
      const tr = inp.closest("tr"); tr.classList.toggle("changed", inp.value !== s.config[+tr.dataset.k].text);
    });
  }
  $("#srcToggle").onclick = () => {
    const b = $("#srcBody"), show = b.style.display === "none";
    if (show && !b.innerHTML) b.innerHTML = codeBlock(s.source, 1, new Set(s.config.map(c => c.line)));
    b.style.display = show ? "" : "none"; $("#srcToggle").textContent = show ? "收起" : "展开";
  };
}
async function saveConfig() {
  const s = state.script;
  const values = [...document.querySelectorAll("table.cfg tr.changed")].map(tr => {
    const c = s.config[+tr.dataset.k]; return { name: c.name, line: c.line, text: tr.querySelector("input").value };
  });
  if (!values.length) return toast("没有改动");
  try { state.script = await api("/api/case/config", { path: s.path, values }); renderCaseMain(); toast(`已保存 ${values.length} 项`, "ok"); }
  catch (e) { toast(e.message, "err"); }
}
function openCopy() {
  $("#copySource").textContent = state.script.path;
  $("#copyCase").innerHTML = `<option value="">—</option>` + state.cases.map(c => `<option>${esc(c.name)}</option>`).join("");
  $("#copyNew").value = ""; $("#copyOverwrite").checked = false;
  $("#copyDialog").showModal();
}
$("#copyDialog").addEventListener("close", async () => {
  if ($("#copyDialog").returnValue !== "ok") return;
  const kase = $("#copyNew").value.trim() || $("#copyCase").value;
  if (!kase) return toast("请选择或输入案例名", "err");
  try {
    const r = await api("/api/case/copy", { path: state.script.path, case: kase, overwrite: $("#copyOverwrite").checked });
    toast("已复制到 " + r.path, "ok"); state.openCases.add(kase); await loadCases(); openScript(r.path);
  } catch (e) { toast(e.message, "err"); }
});
$("#newDialog").addEventListener("close", async () => {
  if ($("#newDialog").returnValue !== "ok") return;
  const name = $("#newName").value.trim();
  try { await api("/api/case/create", { name }); state.openCases.add(name); state.script = null; await loadCases(); renderCaseMain(name); toast("已新建 cases/" + name, "ok"); }
  catch (e) { toast(e.message, "err"); }
});

/* ------------------------------ runs ------------------------------ */
async function runScript() {
  if (document.querySelector("table.cfg tr.changed") && !confirm("有未保存的配置改动，仍按磁盘上的脚本运行？")) return;
  try {
    const r = await api("/api/case/run", { path: state.script.path, python: state.python });
    toast("已启动 " + r.path, "ok"); $("#runs").classList.remove("collapsed"); $("#toggleRuns").textContent = "收起";
    selectRun(r.id); refreshRuns();
  } catch (e) { toast(e.message, "err"); }
}
function fmtTime(t) { return t ? new Date(t * 1000).toLocaleTimeString() : ""; }
const STATUS = { running: "运行中", stopping: "停止中", done: "完成", failed: "失败", stopped: "已停止" };
async function refreshRuns() {
  state.runs = await api("/api/case/runs");
  $("#runItems").innerHTML = state.runs.map(r => `<div class="run ${r.id === state.runId ? "active" : ""}" data-id="${esc(r.id)}">
      <div class="p">${esc(r.path)}</div><div><span class="st ${r.status}">${STATUS[r.status] || r.status}</span>
      ${r.returncode !== null ? ` · 退出码 ${r.returncode}` : ""} · ${fmtTime(r.start)}${r.end ? " → " + fmtTime(r.end) : ""}</div></div>`).join("")
    || `<div class="empty" style="padding:10px 12px">还没有运行</div>`;
  $("#runItems").querySelectorAll(".run").forEach(el => el.onclick = () => selectRun(el.dataset.id));
}
function selectRun(id) {
  state.runId = id; state.logOffset = 0; $("#log").textContent = ""; refreshRuns(); pollLog();
}
async function pollLog() {
  if (!state.runId) return;
  try {
    const d = await api(`/api/case/log?id=${encodeURIComponent(state.runId)}&offset=${state.logOffset}`);
    const log = $("#log"), stick = log.scrollTop + log.clientHeight >= log.scrollHeight - 20;
    if (d.text) { log.textContent += d.text; if (stick) log.scrollTop = log.scrollHeight; }
    state.logOffset = d.offset;
    $("#logTitle").textContent = `${d.run.log} · ${STATUS[d.run.status] || d.run.status}`;
    $("#stopBtn").disabled = d.run.status !== "running";
  } catch (e) { /* run list may be stale */ }
}
$("#stopBtn").onclick = async () => { try { await api("/api/case/stop", { id: state.runId }); refreshRuns(); } catch (e) { toast(e.message, "err"); } };
$("#toggleRuns").onclick = () => { const c = $("#runs").classList.toggle("collapsed"); $("#toggleRuns").textContent = c ? "展开" : "收起"; };
setInterval(() => { if (document.querySelector("#view-case.active")) { pollLog(); if (state.runs.some(r => r.status === "running" || r.status === "stopping")) refreshRuns(); } }, 1000);

/* ------------------------------ init ------------------------------ */
(async () => {
  try {
    const info = await api("/api/info");
    $("#repo").textContent = info.repo; state.python = info.python;
    await loadBase(); refreshRuns();
  } catch (e) { toast(e.message, "err"); }
})();
</script>
</body>
</html>
