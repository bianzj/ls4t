[machine]
id = "example"
description = "Copy to local.toml and replace paths for this machine."

[paths]
zip_root = "/replace/data/zip"
raw_root = "/replace/data/raw"
extract_root = "/replace/products/extract"
reconstruct_root = "/replace/products/reconstruct"
project_root = "/replace/products/project"
merge_root = "/replace/products/merge"
merge_input_root = "/replace/data/one-explicit-scene-group"
merge_output_file = "/replace/products/merge/one-group.npz"
retrieval_input_root = "/replace/data/prepared-for-retrieval"
lst_root = "/replace/products/lst"
lsct_input_root = "/replace/data/lsct_input"
lsct_root = "/replace/products/lsct"
target_grid_file = "/replace/auxiliary/target_grid.tif"
static_file = "/replace/auxiliary/static.npz"
coefficient_file = "/replace/auxiliary/lst_coefficients.npz"
auxiliary_file = "/replace/auxiliary/lst_auxiliary.npz"

# Paths are passed to the selected standard function as its root arguments.
# Check that module's year/day templates before running on an existing tree.

[runtime]
workers = 1
scratch_root = "/replace/scratch"
